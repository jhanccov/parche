services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parche
      POSTGRES_PASSWORD: parche
      POSTGRES_DB: parche
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parche"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://parche:parche@db:5432/parche
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      DEMO_MODE: ${DEMO_MODE:-true}
      SMTP_URL: ${SMTP_URL:-}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
