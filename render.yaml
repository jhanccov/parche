# Despliegue en Render (https://render.com): New > Blueprint > elegir este repositorio.
services:
  - type: web
    name: parche
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parche-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: Parche <no-reply@parche.app>

databases:
  - name: parche-db
    plan: free
    databaseName: parche
    user: parche
